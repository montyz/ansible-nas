---
# This is a Audioserve playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove Audioserve
      community.docker.docker_container:
        name: "{{ audioserve_container_name }}"
        state: absent
      register: result

    - name: Check Audioserve is stopped
      ansible.builtin.assert:
        that:
          - not result.changed
